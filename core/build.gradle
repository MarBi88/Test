dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"

    // Tests laufen headless (ohne Fenster/GPU): libGDX-Headless-Backend + gemocktes GL
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.12.0"
    testImplementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
    testImplementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}
// Quellcode muss für GWT als Ressource mitgeliefert werden.
sourceSets.main.resources.srcDir 'src/main/java'

tasks.named('test') {
    useJUnit()
    testLogging { events 'passed', 'failed', 'skipped'; exceptionFormat 'full'; showStandardStreams = false }
}
